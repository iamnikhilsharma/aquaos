# AquaOS Picom Compositor Configuration (X11 Fallback with Dual-Kawase Frosted Blur & Rounded Corners)
backend = "glx";
vsync = true;
corner-radius = 12;

shadow = true;
shadow-radius = 28;
shadow-opacity = 0.45;
shadow-offset-x = -24;
shadow-offset-y = -18;

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

blur: {
  method = "dual_kawase";
  strength = 6;
  background = true;
};
