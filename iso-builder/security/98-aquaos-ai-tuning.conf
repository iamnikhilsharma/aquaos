# AquaOS Kernel & Memory Tuning for Local AI / LLM Workloads (98-aquaos-ai-tuning.conf)
# Enables zero-copy mmap for large GGUF/Safetensors weights and prevents OOM during tensor allocation

vm.max_map_count = 2147483642
vm.swappiness = 10
vm.overcommit_memory = 1
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
kernel.sched_autogroup_enabled = 1
