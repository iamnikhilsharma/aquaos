#!/usr/sbin/nft -f
# AquaOS Zero-Trust Default-Deny Inbound Firewall (nftables.conf)

flush ruleset

table inet aqua_shield {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback (required for local Ollama / llama.cpp AI daemon on 127.0.0.1)
        iif "lo" accept

        # Allow established/related outbound responses
        ct state established,related accept

        # Drop invalid packets
        ct state invalid drop

        # Allow ICMPv6 Neighbor Discovery
        ip6 nexthdr icmpv6 icmpv6 type { nd-neighbor-solicit, nd-router-advert, nd-neighbor-advert } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
